    <path d="M 6 18 Q 11 14.5, 16 18 T 26 18" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M 6 23 Q 11 19.5, 16 23 T 26 23" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  </g>
